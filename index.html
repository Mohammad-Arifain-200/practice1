<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Card</title>

    <!-- CSS file connect -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- Main Profile Card -->
    <div class="profile-card">

        <!-- Top Pink Header -->
        <div class="card-header">

            <!-- Profile Image -->
            <img src="image/My.png"
                 alt="Profile Picture"
                 class="profile-image">

            <!-- Wave Design -->
            <div class="wave"></div>

        </div>


        <!-- Bottom White Section -->
        <div class="card-body">

            <!-- Name -->
            <h2 class="name">
                Mohammad Arfain
            </h2>

            <!-- Username -->
            <p class="username">
                @arifin
            </p>


            <!-- Social Media Icons -->
            <div class="social-icons">

                <!-- Behance -->
                <a href="https://www.behance.net/arifin" target="_blank">
                    <i class="fa-brands fa-behance"></i>
                </a>


                <!-- Dribbble -->
                <a href="https://dribbble.com/arifin" target="_blank">
                    <i class="fa-brands fa-dribbble"></i>
                </a>


                <!-- Instagram -->
                <a href="https://www.instagram.com/arifin" target="_blank">
                    <i class="fa-brands fa-instagram"></i>
                </a>


                <!-- Twitter -->
                <a href="https://twitter.com/arifin" target="_blank">
                    <i class="fa-brands fa-twitter"></i>
                </a>


                <!-- Facebook -->
                <a href="https://www.facebook.com/arifin" target="_blank">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>


                <!-- LinkedIn -->
                <a href="https://www.linkedin.com/in/arifin" target="_blank">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

            </div>


            <!-- Description -->
            <p class="description">
                Brand and communication strategy, graphic
                design, illustration, art direction and portrait
                photography.
            </p>


            <!-- Bottom Text -->
            <p class="company">
                Creative at Superblaisé.
            </p>

        </div>

    </div>

</body>

</html>
